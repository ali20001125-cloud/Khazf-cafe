<title>قفزة بكسل</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0F1E30;
    --panel: #172C44;
    --text: #EAF2FA;
    --muted: #9FB3C8;
    --accent: #FFD23F;
    --accent-ink: #3A2A00;
    --danger: #FF6B5A;
  }
  html, body { background: var(--bg); color: var(--text); }
  body { font-family: "Vazirmatn", "Segoe UI", Tahoma, sans-serif; }
  .wrap {
    max-width: 960px; margin: 0 auto;
    padding-inline: 16px; padding-block: 20px 28px;
    display: flex; flex-direction: column; gap: 14px;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-family: "Lalezar", "Vazirmatn", sans-serif; font-weight: 400; font-size: clamp(30px, 6vw, 44px); line-height: 1; margin: 0; color: var(--accent); letter-spacing: 0.5px; }
  .tag { color: var(--muted); font-size: 14px; margin: 0; }
  .stage {
    position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%;
    border-radius: 10px; overflow: hidden; background: #5BC0F8;
    box-shadow: 0 0 0 3px #0A1523, 0 14px 40px rgba(0,0,0,.45);
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    cursor: pointer;
  }
  @media (max-width: 600px) { .stage { aspect-ratio: 4 / 3; } }
  canvas { display: block; width: 100%; height: 100%; }
  .hud {
    position: absolute; inset: 10px 12px auto 12px;
    display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none;
    font-family: "Lalezar", "Vazirmatn", sans-serif; font-size: clamp(14px, 2.6vw, 20px);
    font-variant-numeric: tabular-nums;
  }
  .chip { background: rgba(10, 21, 35, .55); color: #fff; padding: 2px 10px 0; border-radius: 6px; }
  .chip b { color: var(--accent); font-weight: 400; }
  .overlay {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(10, 21, 35, .55); padding: 16px;
  }
  .card {
    background: var(--panel); border: 3px solid #0A1523; border-radius: 10px;
    padding: 18px 22px; max-width: 360px; width: 100%;
    display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center;
  }
  .card h2 { font-family: "Lalezar", "Vazirmatn", sans-serif; font-weight: 400; font-size: clamp(26px, 5vw, 36px); margin: 0; line-height: 1.1; text-wrap: balance; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .card .big { font-family: "Lalezar", sans-serif; font-size: 40px; color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; }
  button {
    font-family: "Lalezar", "Vazirmatn", sans-serif; font-size: 20px;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px;
    padding: 8px 26px 4px; cursor: pointer; box-shadow: 0 4px 0 #B8900F;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #B8900F; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .keys { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 14px; margin: 0; padding: 0; list-style: none; }
  kbd { font-family: inherit; background: var(--panel); border: 1px solid #2B4666; border-bottom-width: 3px; border-radius: 5px; padding: 0 7px; color: var(--text); }
</style>

<div class="wrap" dir="rtl">
  <header>
    <h1>قفزة بكسل</h1>
    <p class="tag">اركض، اقفز فوق الحفر، ودوس على الوحوش.</p>
  </header>

  <div class="stage" id="stage">
    <canvas id="game" aria-label="ساحة اللعب"></canvas>
    <div class="hud" aria-live="off">
      <span class="chip">المسافة <b id="hudDist">0</b>م</span>
      <span class="chip">العملات <b id="hudCoins">0</b></span>
      <span class="chip">الأفضل <b id="hudBest">0</b></span>
    </div>
    <div class="overlay" id="overlay">
      <div class="card" id="card">
        <h2 id="cardTitle">جاهز تركض؟</h2>
        <p id="cardText">البطل يركض لوحده. انت بس اقفز. الضغطة الطويلة تعطي قفزة أعلى.</p>
        <div class="big" id="cardScore" hidden>0</div>
        <button id="startBtn" type="button">ابدأ</button>
      </div>
    </div>
  </div>

  <ul class="keys">
    <li>القفز: <kbd>مسافة</kbd> أو <kbd>↑</kbd> أو المس الشاشة</li>
    <li>النقاط: متر = 1، عملة = 5، وحش = 10</li>
  </ul>
</div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const overlay = $('overlay'), cardTitle = $('cardTitle'), cardText = $('cardText'), cardScore = $('cardScore'), startBtn = $('startBtn');

  // Logical resolution: fixed height, width follows the stage's aspect ratio.
  const H = 270, T = 24;
  let W = 480, scale = 1;
  function resize() {
    const r = cv.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.round(H * r.width / r.height);
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);
    scale = cv.height / H;
    ctx.imageSmoothingEnabled = false;
  }
  window.addEventListener('resize', resize);

  let best = 0;
  try { best = +localStorage.getItem('pixel-jump-best') || 0; } catch (e) {}
  $('hudBest').textContent = best;

  const G = 1800, JUMP = 560, BASE_SPEED = 170, MAX_EXTRA = 150;
  let state = 'ready', overTimer = 0;
  let p, camX, segs, plats, coins, enemies, pops, genX, lastTop, nCoins, nStomps, holding = false, buffer = 0, coyote = 0, runPhase = 0;

  const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

  function reset() {
    lastTop = H - T * 3;
    segs = [{ x: -240, w: 240 + T * 22, top: lastTop }];
    genX = segs[0].x + segs[0].w;
    plats = []; coins = []; enemies = []; pops = [];
    p = { x: 40, y: lastTop - 24, w: 18, h: 24, vy: 0, onGround: true };
    camX = p.x - W * 0.28;
    nCoins = 0; nStomps = 0; buffer = 0; coyote = 0;
    generate();
  }

  const difficulty = () => Math.min(1, Math.max(0, p.x / 12000));
  const speed = () => BASE_SPEED + MAX_EXTRA * difficulty();
  const meters = () => Math.max(0, Math.floor(p.x / T));
  const score = () => meters() + nCoins * 5 + nStomps * 10;

  function generate() {
    while (genX < camX + W + 300) {
      const d = difficulty();
      const gap = T * rand(2, 2 + Math.round(d * 2));
      const top = Math.max(H - T * 5, Math.min(H - T * 2, lastTop + rand(-1, 1) * T));
      const w = T * rand(5, 13);
      const x = genX + gap;
      const arcBase = Math.min(lastTop, top) - T * 2;
      [0, 14, 0].forEach((lift, i) => coins.push({ x: genX + gap * (i + 1) / 4, y: arcBase - lift, got: false }));
      const seg = { x, w, top };
      segs.push(seg);
      if (w >= T * 7 && Math.random() < 0.35 + d * 0.4) {
        enemies.push({ x: x + w * 0.6, y: top - 18, w: 22, h: 18, vx: -40 - d * 30, seg, dead: 0 });
      }
      if (w >= T * 8 && Math.random() < 0.45) {
        const pw = T * rand(3, 5), px = x + T * 2, py = top - T * 3;
        plats.push({ x: px, w: pw, top: py });
        for (let cx = px + T / 2; cx < px + pw; cx += T) coins.push({ x: cx, y: py - T, got: false });
      }
      genX = x + w; lastTop = top;
    }
    const cut = camX - 120;
    segs = segs.filter(s => s.x + s.w > cut);
    plats = plats.filter(s => s.x + s.w > cut);
    coins = coins.filter(c => c.x > cut && !c.got);
    enemies = enemies.filter(e => e.x + e.w > cut && e.dead < 0.4);
  }

  function jumpDown() { holding = true; buffer = 0.12; }
  function jumpUp() { holding = false; }

  function update(dt) {
    buffer -= dt;
    // Horizontal: run forward, stop against the face of a higher block.
    let nx = p.x + speed() * dt;
    for (const s of segs) {
      if (p.y + p.h > s.top + 2 && p.x + p.w <= s.x + 0.5 && nx + p.w > s.x) nx = s.x - p.w;
    }
    p.x = nx;

    if (p.onGround) coyote = 0.1; else coyote -= dt;
    if (buffer > 0 && coyote > 0) { p.vy = -JUMP; buffer = 0; coyote = 0; p.onGround = false; }

    const g = holding && p.vy < 0 ? G * 0.5 : G;
    p.vy = Math.min(p.vy + g * dt, 900);
    const prevBottom = p.y + p.h;
    let ny = p.y + p.vy * dt;
    p.onGround = false;
    if (p.vy >= 0) {
      for (const s of segs.concat(plats)) {
        if (p.x + p.w > s.x + 1 && p.x < s.x + s.w - 1 && prevBottom <= s.top + 0.5 && ny + p.h >= s.top) {
          ny = s.top - p.h; p.vy = 0; p.onGround = true;
        }
      }
    }
    p.y = ny;
    runPhase += dt * (p.onGround ? speed() / 14 : 0);

    for (const c of coins) {
      if (!c.got && Math.abs(p.x + p.w / 2 - c.x) < 14 && Math.abs(p.y + p.h / 2 - c.y) < 18) {
        c.got = true; nCoins++; pops.push({ x: c.x, y: c.y, t: 0, text: '+5' });
      }
    }

    for (const e of enemies) {
      if (e.dead) { e.dead += dt; continue; }
      e.x += e.vx * dt;
      if (e.x < e.seg.x || e.x + e.w > e.seg.x + e.seg.w) { e.vx *= -1; e.x = Math.max(e.seg.x, Math.min(e.x, e.seg.x + e.seg.w - e.w)); }
      const hit = p.x + p.w > e.x + 2 && p.x < e.x + e.w - 2 && p.y + p.h > e.y && p.y < e.y + e.h;
      if (!hit) continue;
      if (p.vy > 0 && prevBottom <= e.y + 8) {
        e.dead = 0.001; nStomps++;
        p.vy = holding ? -JUMP : -400;
        pops.push({ x: e.x + e.w / 2, y: e.y, t: 0, text: '+10' });
      } else {
        return die();
      }
    }

    pops.forEach(o => o.t += dt);
    pops = pops.filter(o => o.t < 0.7);

    camX = p.x - W * 0.28;
    generate();
    if (p.y > H + 40) die();
  }

  function die() {
    state = 'over'; overTimer = 0; holding = false;
    const s = score();
    const isBest = s > best;
    if (isBest) { best = s; try { localStorage.setItem('pixel-jump-best', best); } catch (e) {} }
    cardTitle.textContent = isBest ? 'رقم قياسي جديد!' : 'خلصت الجولة';
    cardText.textContent = `${meters()} متر، ${nCoins} عملة، ${nStomps} وحش.`;
    cardScore.textContent = s; cardScore.hidden = false;
    startBtn.textContent = 'العب مرة ثانية';
    overlay.hidden = false;
    hud();
  }

  function start() {
    if (state === 'play') return;
    if (state === 'over' && overTimer < 0.5) return;
    resize(); reset(); state = 'play'; overlay.hidden = true; last = performance.now();
  }

  function pause() {
    if (state !== 'play') return;
    state = 'paused'; holding = false;
    cardTitle.textContent = 'استراحة';
    cardText.textContent = 'اللعبة متوقفة. كمّل من وين ما وقفت.';
    cardScore.hidden = true; startBtn.textContent = 'كمّل';
    overlay.hidden = false;
  }
  function resume() { state = 'play'; overlay.hidden = true; last = performance.now(); }

  function hud() {
    $('hudDist').textContent = meters();
    $('hudCoins').textContent = nCoins;
    $('hudBest').textContent = Math.max(best, state === 'play' ? score() : 0);
  }

  // ---------- Drawing ----------
  const R = Math.round;
  function hills(par, base, amp, freq, color) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(0, H);
    const off = camX * par;
    for (let x = 0; x <= W + 8; x += 8) {
      const wx = x + off;
      ctx.lineTo(x, base - amp * (0.6 * Math.sin(wx * freq) + 0.4 * Math.sin(wx * freq * 2.3 + 1)));
    }
    ctx.lineTo(W, H); ctx.fill();
  }
  function clouds() {
    const par = 0.15, span = 220, off = camX * par;
    const first = Math.floor(off / span) - 1;
    ctx.fillStyle = '#FFFFFF';
    for (let i = first; i < first + W / span + 3; i++) {
      const h = Math.abs(Math.sin(i * 12.9898) * 43758.5453) % 1;
      const x = R(i * span - off + h * 80), y = R(24 + h * 60), w = R(40 + h * 40);
      ctx.fillRect(x, y, w, 10); ctx.fillRect(x + 8, y - 8, w - 20, 8); ctx.fillRect(x + 16, y - 14, w * 0.35, 6);
    }
  }
  function drawGround(s) {
    const x = R(s.x - camX), w = R(s.w);
    ctx.fillStyle = '#9C5A2B'; ctx.fillRect(x, s.top, w, H - s.top);
    ctx.fillStyle = '#7F4620';
    for (let tx = 0; tx < w; tx += 12) for (let ty = s.top + 14; ty < H; ty += 12) {
      if (((s.x + tx) / 12 + ty / 12) % 3 < 1) ctx.fillRect(x + tx + 3, ty, 4, 4);
    }
    ctx.fillStyle = '#4CBB47'; ctx.fillRect(x, s.top, w, 7);
    ctx.fillStyle = '#2F8F33'; ctx.fillRect(x, s.top + 7, w, 2);
    ctx.fillStyle = '#6FD86A'; ctx.fillRect(x, s.top, w, 2);
  }
  function drawPlat(s) {
    const x = R(s.x - camX);
    ctx.fillStyle = '#C8553D'; ctx.fillRect(x, s.top, s.w, 14);
    ctx.fillStyle = '#8E3522';
    ctx.fillRect(x, s.top + 6, s.w, 2);
    for (let bx = 0; bx < s.w; bx += 12) { ctx.fillRect(x + bx, s.top, 2, 6); ctx.fillRect(x + bx + 6, s.top + 8, 2, 6); }
    ctx.fillStyle = '#E8826B'; ctx.fillRect(x, s.top, s.w, 2);
  }
  function drawCoin(c, t) {
    const sw = Math.abs(Math.sin(t * 5 + c.x * 0.05));
    const w = Math.max(2, R(10 * sw)), x = R(c.x - camX - w / 2), y = R(c.y - 7);
    ctx.fillStyle = '#C9971C'; ctx.fillRect(x - 1, y, w + 2, 14);
    ctx.fillStyle = '#FFD23F'; ctx.fillRect(x, y + 1, w, 12);
    if (w > 5) { ctx.fillStyle = '#FFF1A8'; ctx.fillRect(x + 1, y + 3, 2, 6); }
  }
  function drawEnemy(e, t) {
    const x = R(e.x - camX);
    if (e.dead) {
      ctx.fillStyle = '#7B4FA0'; ctx.fillRect(x, R(e.y + e.h - 6), e.w, 6);
      return;
    }
    const step = Math.floor(t * 8) % 2;
    const y = R(e.y);
    ctx.fillStyle = '#7B4FA0'; ctx.fillRect(x + 2, y, e.w - 4, e.h - 4); ctx.fillRect(x, y + 4, e.w, e.h - 8);
    ctx.fillStyle = '#4A2C66'; ctx.fillRect(x + (step ? 1 : 4), y + e.h - 4, 7, 4); ctx.fillRect(x + e.w - (step ? 11 : 8), y + e.h - 4, 7, 4);
    const look = e.vx < 0 ? 0 : 3;
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(x + 4 + look, y + 4, 5, 6); ctx.fillRect(x + 12 + look, y + 4, 5, 6);
    ctx.fillStyle = '#1B1030'; ctx.fillRect(x + 4 + look + (e.vx < 0 ? 0 : 3), y + 6, 2, 3); ctx.fillRect(x + 12 + look + (e.vx < 0 ? 0 : 3), y + 6, 2, 3);
  }
  function drawPlayer() {
    const x = R(p.x - camX), y = R(p.y);
    const air = !p.onGround;
    const leg = Math.floor(runPhase) % 2;
    // legs
    ctx.fillStyle = '#23324A';
    if (air) { ctx.fillRect(x + 3, y + 19, 5, 4); ctx.fillRect(x + 11, y + 17, 5, 4); }
    else { ctx.fillRect(x + (leg ? 2 : 5), y + 19, 5, 5); ctx.fillRect(x + (leg ? 11 : 9), y + 19, 5, 5); }
    // body
    ctx.fillStyle = '#FF7A2F'; ctx.fillRect(x + 1, y + 6, 16, 14);
    ctx.fillStyle = '#FFE3C9'; ctx.fillRect(x + 5, y + 12, 9, 7);
    // head
    ctx.fillStyle = '#FF7A2F'; ctx.fillRect(x + 2, y, 15, 9);
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(x + 10, y + 2, 5, 5);
    ctx.fillStyle = '#10233A'; ctx.fillRect(x + 12, y + 3, 2, 3);
    // scarf trailing behind
    ctx.fillStyle = '#2FB7A8'; ctx.fillRect(x + 1, y + 8, 16, 3);
    const flap = air ? 2 : (leg ? 0 : 2);
    ctx.fillRect(x - 5, y + 8 + flap, 6, 3);
  }

  function draw(t) {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#4FB4F2'); sky.addColorStop(1, '#C4ECFF');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#FFF4B0'; ctx.fillRect(W - 70, 22, 26, 26);
    clouds();
    hills(0.2, H - 60, 26, 0.012, '#9ED99A');
    hills(0.45, H - 36, 20, 0.02, '#6CC06A');
    for (const s of segs) drawGround(s);
    for (const s of plats) drawPlat(s);
    for (const c of coins) if (!c.got) drawCoin(c, t);
    for (const e of enemies) drawEnemy(e, t);
    if (state !== 'over' || overTimer < 0.05 || Math.floor(overTimer * 10) % 2) drawPlayer();
    ctx.font = '12px "Lalezar", sans-serif'; ctx.textAlign = 'center'; ctx.direction = 'ltr';
    for (const o of pops) {
      ctx.globalAlpha = 1 - o.t / 0.7;
      ctx.fillStyle = '#10233A'; ctx.fillText(o.text, R(o.x - camX) + 1, R(o.y - 10 - o.t * 30) + 1);
      ctx.fillStyle = '#FFFFFF'; ctx.fillText(o.text, R(o.x - camX), R(o.y - 10 - o.t * 30));
    }
    ctx.globalAlpha = 1;
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(1 / 30, (now - last) / 1000);
    last = now;
    if (state === 'play') { update(dt); hud(); }
    else if (state === 'over') overTimer += dt;
    draw(now / 1000);
    requestAnimationFrame(frame);
  }

  // ---------- Input ----------
  function press() {
    if (state === 'play') jumpDown();
    else if (state === 'paused') resume();
    else start();
  }
  stage.addEventListener('pointerdown', e => {
    if (e.target === startBtn) return;
    e.preventDefault(); press();
  });
  window.addEventListener('pointerup', jumpUp);
  window.addEventListener('pointercancel', jumpUp);
  startBtn.addEventListener('click', () => { state === 'paused' ? resume() : start(); });
  const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW'];
  window.addEventListener('keydown', e => {
    if (!JUMP_KEYS.includes(e.code)) return;
    e.preventDefault();
    if (e.repeat) return;
    press();
  });
  window.addEventListener('keyup', e => { if (JUMP_KEYS.includes(e.code)) jumpUp(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('blur', pause);

  resize(); reset();
  requestAnimationFrame(frame);
})();
</script>
